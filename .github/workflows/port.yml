name: Build HyperOS for OnePlus 9 Pro

on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: "OnePlus 9 Pro stock ROM link (full OTA/fastboot zip or payload.bin) — source of vendor + odm"
        required: true
        type: string
      hyperos_url:
        description: "HyperOS donor ROM link (full recovery/OTA zip or payload.bin) — source of system + system_ext + product"
        required: true
        type: string
      name:
        description: "Output name for the port zip"
        required: false
        default: "HyperOS-OnePlus9Pro-port"
        type: string
      density:
        description: "Optional logical LCD density override; leave empty for auto-detect/preserve donor"
        required: false
        default: ""
        type: string
      upload_pixeldrain:
        description: "Upload the finished zip to pixeldrain (needs PIXELDRAIN_API_KEY)"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          chmod +x requirements.sh port.sh port.py
          ./requirements.sh

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Build OnePlus 9 Pro port
        env:
          STOCK_URL: ${{ inputs.stock_url }}
          HYPEROS_URL: ${{ inputs.hyperos_url }}
          OUTPUT_NAME: ${{ inputs.name }}
          DENSITY: ${{ inputs.density }}
        run: |
          args=(--stock "$STOCK_URL" --hyperos "$HYPEROS_URL" --name "$OUTPUT_NAME")
          if [ -n "$DENSITY" ]; then
            args+=(--density "$DENSITY")
          fi
          ./port.sh "${args[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload to pixeldrain
        if: ${{ inputs.upload_pixeldrain }}
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          if [ -z "$PIXELDRAIN_API_KEY" ]; then
            echo "::warning::PIXELDRAIN_API_KEY is not set; keeping the GitHub Actions artifact only."
            exit 0
          fi
          ZIP="$(ls out/*.zip | head -n1)"
          BASENAME="$(basename "$ZIP")"
          curl -fsSL https://rclone.org/install.sh | sudo bash || sudo apt-get install -y rclone
          export RCLONE_CONFIG_PD_TYPE=pixeldrain
          export RCLONE_CONFIG_PD_API_KEY="$PIXELDRAIN_API_KEY"
          export RCLONE_CONFIG_PD_ROOT_FOLDER_ID=me
          if rclone copy --stats-one-line --stats 30s "$ZIP" pd:/ ; then
            LINK="$(rclone link "pd:/$BASENAME" 2>/dev/null || true)"
            [ -z "$LINK" ] || echo "### Pixeldrain: [$BASENAME]($LINK)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Pixeldrain upload failed; the Actions artifact is still available."
          fi
